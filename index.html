<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="api-url" content="http://localhost:3000/entries" />
  <link rel="icon" href="data:,">
  <title>TraceDiary - Quant & Algo Log</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="./style.css" />

  <!-- Early-load theme script: sets data-bs-theme before paint to prevent flash -->
  <script>
    (() => {
      const stored = localStorage.getItem('theme') || 'system';
      const resolved = stored === 'system'
        ? 'light'//(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : stored;
      document.documentElement.setAttribute('data-bs-theme', resolved);
    })();
  </script>
</head>
<body class="bg-light">

  <!-- Sticky Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-primary" href="#">
        <i class="bi bi-journal-code me-2"></i>TRACE DIARY
      </a>
      <div class="d-flex align-items-center gap-3">
        <i class="bi bi-search text-light role-button"></i>
        <i class="bi bi-person-circle fs-5 text-light"></i>
      </div>
    </div>
  </nav>

  <main class="container py-3 pb-5">

    <!-- Sequential View Wrappers for Mobile / Split Pane for Desktop -->
    <div class="row g-4">

      <!-- LEFT / LIST VIEW PANEL -->
      <div id="listView" class="col-12 col-md-5 d-block">

        <!-- Controls & Add Button -->
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h5 mb-0 fw-bold">Header Section</h2>
        </div>

        <!-- Search and Filter Controls -->
        <div class="input-group input-group-sm mb-2">
          <label class="input-group-text" for="searchInput"><i class="bi bi-search"></i></label>
          <input type="search" class="form-control" id="searchInput" placeholder="Search title, symptom, fix" aria-label="Search entries" />
        </div>

        <div class="d-flex gap-2 mb-3">
          <div class="input-group input-group-sm">
            <label class="input-group-text" for="categoryFilter"><i class="bi bi-funnel"></i></label>
            <select class="form-select" id="categoryFilter">
              <option value="ALL">All Categories</option>
            </select>
          </div>
          <div class="input-group input-group-sm">
            <label class="input-group-text" for="sortSelect"><i class="bi bi-sort-down"></i></label>
            <select class="form-select" id="sortSelect">
              <option value="default" selected>Default order</option>
              <option value="date-desc">Newest</option>
              <option value="date-asc">Oldest</option>
              <option value="title-asc">Title A-Z</option>
              <option value="category-asc">Category A-Z</option>
            </select>
          </div>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="refreshBtn" title="Refresh" aria-label="Refresh">
            <i class="bi bi-arrow-clockwise"></i>
          </button>
        </div>

        <!-- Entry List Target Container -->
        <div id="entriesList" class="d-flex flex-column gap-2">
          <!-- Dynamic JS Card Injection Target -->
        </div>
      </div>

      <!-- RIGHT / DETAILED VIEW PANEL -->
      <div id="detailView" class="col-12 col-md-7 d-none d-md-block">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-white d-flex justify-content-between align-items-center py-2">
            <button class="btn btn-outline-secondary btn-sm d-md-none" id="backToListBtn" title="Back to list">
              <i class="bi bi-arrow-left me-1"></i> Back
            </button>
            <span class="fw-semibold text-muted small" id="detailHeaderTitle">TraceDiary Entry</span>
            <div id="detailActionGroup" class="d-none">
              <button class="btn btn-outline-primary btn-sm me-1" id="editEntryBtn" title="Edit Entry" aria-label="Edit Entry"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-outline-danger btn-sm" id="deleteEntryBtn" title="Delete Entry" aria-label="Delete Entry"><i class="bi bi-trash3"></i></button>
            </div>
          </div>
          <div class="card-body" id="detailContent">
            <p class="text-muted text-center my-5">Select an entry from the list to view full details.</p>
          </div>
        </div>
      </div>

    </div>

    <!-- Console Output Panel -->
    <section id="console-container" class="console-container" hidden>
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="h6 mb-0 fw-semibold text-muted">
          <i class="bi bi-terminal me-1"></i>Console Output
        </h2>
        <button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2" id="clearConsoleBtn" title="Clear console" aria-label="Clear console">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div
        id="console-output"
        class="console-output"
        role="status"
        aria-live="polite"
      ></div>
    </section>

    <!-- Create/Update Modal Form -->
    <div class="modal fade" id="entryModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="formModalTitle">Create New Entry</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" title="Close" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="logForm">
              <input type="hidden" id="entryId" />
              <div class="row g-3">
                <div class="col-md-4">
                  <label for="category" class="form-label small fw-semibold">Category</label>
                  <select class="form-select" id="category" required>
                    <option value="" disabled selected>Select Category</option>
                    <option value="MQL5">MQL5</option>
                    <option value="Data Pipeline">Data Pipeline</option>
                    <option value="Backtesting">Backtesting</option>
                    <option value="Infrastructure">Infrastructure</option>
                  </select>
                </div>
                <div class="col-md-8">
                  <label for="title" class="form-label small fw-semibold">Title</label>
                  <input type="text" class="form-control" id="title" required />
                </div>
                <div class="col-12">
                  <label for="symptom" class="form-label small fw-semibold">Symptom</label>
                  <textarea class="form-control" id="symptom" rows="2" required></textarea>
                </div>
                <div class="col-12">
                  <label for="tried" class="form-label small fw-semibold">Tried</label>
                  <textarea class="form-control" id="tried" rows="2" required></textarea>
                </div>
                <div class="col-12">
                  <label for="rootCause" class="form-label small fw-semibold">Root Cause</label>
                  <textarea class="form-control" id="rootCause" rows="2" required></textarea>
                </div>
                <div class="col-12">
                  <label for="fix" class="form-label small fw-semibold">Fix</label>
                  <textarea class="form-control" id="fix" rows="2" required></textarea>
                </div>
                <div class="col-12">
                  <label for="lesson" class="form-label small fw-semibold">Lesson</label>
                  <input type="text" class="form-control" id="lesson" required />
                </div>
              </div>
              <div class="mt-4 text-end">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal" title="Cancel">Cancel</button>
                <button type="submit" class="btn btn-primary btn-sm" id="submitFormBtn" title="Submit entry">Submit</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- Floating Action Button: Create Entry -->
  <button class="btn btn-primary rounded-circle fab" id="openFormBtn" title="Create Entry" aria-label="Create Entry">
    <i class="bi bi-plus-lg"></i>
  </button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.2/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="./scripts.js"></script>
</body>
</html>
