<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Viewport meta tag required for mobile responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Company Page (Semantic + Bootstrap + ARIA)</title>

    <!-- 1. Bootstrap CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light">
    <!-- Masthead and page title -->
    <header class="bg-primary text-white text-center py-4 mb-3" role="banner">
      <div class="container">
        <h1 class="display-4 fw-bold">Investment Company</h1>
        <p class="lead mb-0">About Us</p>
      </div>
    </header>

    <!-- Primary navigation links styled with Bootstrap Navbar & ARIA -->
    <nav
      class="navbar navbar-expand-md navbar-dark bg-dark mb-4 sticky-top"
      aria-label="Main navigation"
    >
      <div class="container">
        <a class="navbar-brand" href="#">Investment Co.</a>

        <!-- ARIA capabilities integrated on the collapsible menu button -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <!-- aria-current="page" conveys the currently active page to screen readers -->
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="/">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/about">About Us</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/contact">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Dominant content with ARIA container labelling -->
    <main class="container my-4">
      <article class="card shadow-sm p-4" aria-labelledby="story-heading">
        <section>
          <h2 id="story-heading" class="h3 text-primary mb-3">Our Story</h2>
          <p class="card-text fs-5">
            Founded in 2010 to help clients reach financial goals through
            trusted guidance and tailored investment solutions.
          </p>
        </section>
      </article>
    </main>

    <!-- Copyright and meta details -->
    <footer class="bg-dark text-white text-center py-3 mt-5" role="contentinfo">
      <div class="container">
        <p class="mb-0">&copy; 2021 Investment Company. All rights reserved.</p>
      </div>
    </footer>

    <!-- 2. Bootstrap JS Bundle with Popper -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
